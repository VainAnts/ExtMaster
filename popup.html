<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExtMaster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header class="header">
    <div class="header-title">
      <img src="icons/icon128.png" width="18" height="18" style="border-radius:3px">
      <span>ExtMaster</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnTheme" title="切换主题">☀️</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    </div>
  </header>

  <!-- 设置面板 -->
  <div class="panel" id="settingsPanel">
    <div class="panel-header">
      <span>设置</span>
      <button class="icon-btn" id="btnCloseSettings">✕</button>
    </div>
    <div class="panel-body">
      <div class="setting-item">
        <span>自动化规则</span>
        <label class="toggle">
          <input type="checkbox" id="toggleAutoRule">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <button class="btn btn-secondary" id="btnOpenRules">📋 管理规则</button>
      </div>
      <div class="setting-item">
        <button class="btn btn-secondary" id="btnOpenGroups">🗂️ 管理分组</button>
      </div>
      <div class="setting-item setting-browser">
        <span>商店来源</span>
        <select id="browserSelect" class="browser-select">
          <option value="auto">自动检测</option>
          <option value="chrome">Chrome 商店</option>
          <option value="edge">Edge 商店</option>
          <option value="custom">自定义 URL</option>
        </select>
      </div>
      <div class="setting-item" id="customUrlRow" style="display:none">
        <span style="font-size:11px;color:var(--text2)">自定义 URL</span>
        <input type="text" class="form-input" id="customStoreUrl" placeholder="https://..." style="font-size:11px;padding:3px 8px">
      </div>
      <div class="setting-item">
        <button class="btn btn-secondary" id="btnExportNames">📥 导出扩展名称</button>
      </div>
      <div class="setting-item" style="gap:8px">
        <button class="btn btn-secondary" id="btnBackup">💾 备份</button>
        <button class="btn btn-secondary" id="btnRestore">📂 恢复</button>
      </div>
      <input type="file" id="fileRestore" accept=".json" style="display:none">
    </div>
  </div>

  <!-- 分组标签栏（固定，不滚动） -->
  <div class="group-tabs-wrap" id="groupTabsWrap">
    <div class="group-tabs" id="groupTabs">
      <button class="tab active" data-group="all">全部</button>
    </div>
    <button class="icon-btn" id="btnAddGroup" title="新建分组">➕</button>
  </div>

  <!-- 排序工具栏（固定，不滚动） -->
  <div class="sort-bar">
    <div class="sort-select-wrap">
      <select id="sortSelect" class="sort-select">
        <option value="default" title="按浏览器默认顺序排列">默认排序</option>
        <option value="enabledFirst" title="已启用的扩展排在前，已禁用的排在后">激活优先</option>
        <option value="manual" title="拖拽扩展卡片可手动调整顺序">手动排序</option>
      </select>
      <span class="sort-arrow">▼</span>
    </div>
    <div class="sort-hint" id="sortHint" style="display:none">🔄 拖拽排序</div>
  </div>

  <!-- 可滚动内容区域（只包含扩展列表） -->
  <div class="content-area">
    <!-- 扩展列表 -->
    <main class="ext-list" id="extList">
      <div class="loading">⏳ 加载中...</div>
    </main>
  </div>

  <!-- 新建分组弹窗 -->
  <div class="modal-overlay" id="modalAddGroup" style="display:none">
    <div class="modal">
      <div class="modal-header">新建分组</div>
      <div class="modal-body">
        <label class="form-label">分组名称</label>
        <input type="text" class="form-input" id="inputGroupName" placeholder="例如：开发工具" maxlength="20">
        <label class="form-label">颜色</label>
        <div class="color-picker" id="colorPicker">
          <span class="color-dot selected" style="background:#4285F4" data-color="#4285F4"></span>
          <span class="color-dot" style="background:#34A853" data-color="#34A853"></span>
          <span class="color-dot" style="background:#FBBC05" data-color="#FBBC05"></span>
          <span class="color-dot" style="background:#EA4335" data-color="#EA4335"></span>
          <span class="color-dot" style="background:#9C27B0" data-color="#9C27B0"></span>
          <span class="color-dot" style="background:#00BCD4" data-color="#00BCD4"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnCancelGroup">取消</button>
        <button class="btn btn-primary" id="btnConfirmGroup">确定</button>
      </div>
    </div>
  </div>

  <!-- 卸载确认弹窗 -->
  <div class="modal-overlay" id="modalUninstall" style="display:none">
    <div class="modal">
      <div class="modal-header">卸载扩展</div>
      <div class="modal-body">
        <p id="uninstallMsg">确定要卸载此扩展吗？</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnCancelUninstall">取消</button>
        <button class="btn btn-danger" id="btnConfirmUninstall">卸载</button>
      </div>
    </div>
  </div>

  <!-- 底部快捷按钮 -->
  <footer class="footer">
    <button class="btn btn-link" id="btnManageExt">🔧 管理扩展</button>
    <button class="btn btn-link" id="btnStore">🛒 扩展商店</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
