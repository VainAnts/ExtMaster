<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExtMaster - 分组管理</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: 680px; min-height: 450px; }
    .page-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .page-header .btn-primary { background: #4285F4 !important; color: #ffffff !important; border-color: #4285F4 !important; white-space: nowrap; min-width: fit-content; border-radius: 6px !important; padding: 8px 16px !important; font-size: 13px !important; }
    .page-title { font-weight: 600; font-size: 15px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .left-panel { flex: 1; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .right-panel { width: 240px; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
    .panel-title { padding: 10px 12px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }

    /* 分组列表 */
    .group-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .group-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.2s; }
    .group-card.dragging { opacity: 0.4; }
    .group-card.drag-over { border-color: var(--primary); border-style: dashed; background: color-mix(in srgb, var(--primary) 8%, var(--bg2)); }
    .group-card.drag-hover { border-color: var(--primary); border-style: dashed; background: color-mix(in srgb, var(--primary) 12%, var(--bg2)); box-shadow: 0 0 8px rgba(66, 133, 244, 0.3); }
    .sort-indicator { height: 3px; background: var(--primary); border-radius: 2px; margin: 2px 0; pointer-events: none; }
    .group-card-header { display: flex; align-items: center; padding: 8px 10px; gap: 6px; cursor: default; user-select: none; }
    .drag-handle { cursor: grab; color: var(--text2); font-size: 14px; padding: 2px; flex-shrink: 0; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .group-name { flex: 1; font-weight: 500; font-size: 13px; }
    .group-count { font-size: 11px; color: var(--text2); flex-shrink: 0; }
    .group-card-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .group-members { padding: 6px 10px 8px; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 4px; min-height: 24px; transition: background 0.2s; }
    .group-members.open { display: flex; }
    .group-members.drag-hover { background: color-mix(in srgb, var(--primary) 12%, transparent); border-radius: 4px; }
    .member-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-radius: 4px; transition: background 0.2s, opacity 0.2s; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
    .member-item[draggable="true"] { cursor: grab; }
    .member-item[draggable="true"]:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); }
    .member-item[draggable="true"]:active { cursor: grabbing; }
    .member-item.dragging { opacity: 0.3 !important; }
    .member-item.drag-over { position: relative; }
    .member-item.drag-over::before { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), #6ba1ff); border-radius: 2px; z-index: 10; pointer-events: none; box-shadow: 0 0 4px rgba(66, 133, 244, 0.5); }
    .member-icon { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; pointer-events: none; flex-shrink: 0; }
    .member-name { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 30px; color: var(--text2); font-size: 12px; }

    /* 右侧未分组扩展 */
    .ungrouped-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .ext-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); cursor: grab; font-size: 12px; }
    .ext-item:active { cursor: grabbing; }
    .ext-item.dragging { opacity: 0.4; }
    .ext-item-icon { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; }
    .ext-item-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 弹窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg); border-radius: var(--radius); width: 320px; box-shadow: var(--shadow); }
    .modal-header { padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { padding: 8px 16px 12px; display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="page-title">🗂️ 扩展分组</div>
    <button class="btn btn-primary" id="btnAddGroup">➕ 新建分组</button>
  </div>

  <div class="main-layout">
    <!-- 左：分组列表 -->
    <div class="left-panel">
      <div class="panel-title">分组</div>
      <div class="group-list" id="groupList">
        <div class="empty-state">📭 暂无分组</div>
      </div>
    </div>

    <!-- 右：未分组扩展 -->
    <div class="right-panel">
      <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
        <span>未分组扩展 <span id="ungroupedCount" style="color:var(--text2)">0</span></span>
        <select id="groupSortSelect" class="sort-select" style="font-size:12px;padding:2px 4px;max-width:110px;">
          <option value="default" title="按浏览器默认顺序排列">默认</option>
          <option value="enabledFirst" title="已启用的扩展排在前">激活优先</option>
          <option value="manual" title="拖拽扩展卡片可手动调整顺序">手动</option>
        </select>
      </div>
      <div id="groupSortHint" style="display:none;padding:4px 10px;font-size:11px;color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent);">
        ☝ 拖拽扩展可调整顺序
      </div>
      <div class="ungrouped-list" id="ungroupedList"></div>
    </div>
  </div>

  <!-- 新建/编辑分组弹窗 -->
  <div class="modal-overlay" id="modalGroup" style="display:none">
    <div class="modal">
      <div class="modal-header" id="modalGroupTitle">新建分组</div>
      <div class="modal-body">
        <label class="form-label">分组名称</label>
        <input type="text" class="form-input" id="inputGroupName" placeholder="例如：开发工具" maxlength="20">
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnCancelGroup">取消</button>
        <button class="btn btn-danger" id="btnDeleteGroup" style="display:none">删除</button>
        <button class="btn btn-primary" id="btnConfirmGroup">确定</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="groups.js"></script>
</body>
</html>
